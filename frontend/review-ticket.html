<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>help-desk</title>
    <link rel="stylesheet" href="./src/review-ticket.css" />
  </head>
  <main class="main-content">
    <section class="ticket-review">
      <h2 id="ticket-heading">Review Ticket</h2>

      <article class="ticket-card">
        <div class="ticket-details">
          <p>
            <strong>Title:</strong>
            <span id="ticket-title"></span>
          </p>
          <p>
            <strong>Description:</strong><br />
            <span id="ticket-description"></span>
          </p>
          <p id="ticket-attachment-container" hidden>
            <strong>Screenshot:</strong>
            <a id="ticket-attachment" href="#" download>Download attachment</a>
          </p>
        </div>

        <section class="ai-recommendation">
          <h3>AI Recommendation</h3>

          <p>
            <strong>Priority:</strong>
            <span class="priority high"></span>
            <span id="ai-priority">Loading...</span>
          </p>

          <p><strong>AI confidence:</strong></p>
          <span id="ai-confidence">Loading...</span>

          <p>
            <strong>Reason:</strong>
            <span id="ai-reason">Loading...</span>
          </p>
        </section>
      </article>

      <div class="review-actions">
        <button class="approve-button">Approve</button>
        <a class="reject-button" href="index.html">Reject</a>
      </div>
    </section>
  </main>
  <script type="module" src="review-ticket.js"></script>
</html>
